<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::section})}">

<head>

    <title>Categorias</title>

</head>

<body>

<section>


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <div class="dashboard-header">

        <div>

            <h1 class="dashboard-title">
                Categorias
            </h1>

            <p class="dashboard-subtitle">
                Gerencie as categorias cadastradas no sistema.
            </p>

        </div>


        <a th:href="@{/categorias/nova}"
           class="page-button">

            <!-- ÍCONE + -->
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 width="18"
                 height="18">

                <path d="M12 5v14"/>

                <path d="M5 12h14"/>

            </svg>

            <span>Nova Categoria</span>

        </a>

    </div>



    <!-- =====================================================
         LISTA DE CATEGORIAS
    ====================================================== -->

    <div class="dashboard-box products-list-box">


        <!-- CABEÇALHO DO CARD -->

        <div class="products-box-header">

            <div class="products-heading">

                <h2>
                    Categorias cadastradas
                </h2>

                <span>
                    Lista de categorias disponíveis no sistema
                </span>

            </div>

        </div>



        <!-- =================================================
             TABELA
        ================================================== -->

        <div class="table-container">

            <table class="modern-table">


                <!-- CABEÇALHO -->

                <thead>

                <tr>

                    <th class="column-id">
                        ID
                    </th>

                    <th>
                        Nome
                    </th>

                    <th class="column-actions">
                        Ações
                    </th>

                </tr>

                </thead>



                <!-- =================================================
                     CORPO
                ================================================== -->

                <tbody>


                <!-- CATEGORIAS -->

                <tr th:each="categoria : ${categorias}">


                    <!-- ID -->

                    <td class="product-id"
                        th:text="${categoria.id}">

                        1

                    </td>



                    <!-- NOME -->

                    <td class="product-cell">

                        <span class="product-name"
                              th:text="${categoria.nome}">

                            Bebidas e Sucos

                        </span>

                    </td>



                    <!-- AÇÕES -->

                    <td>

                        <div class="product-actions">


                            <!-- EDITAR -->

                            <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}"
                               class="product-action edit-action">


                                <svg xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M12 20h9"/>

                                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>

                                </svg>


                                Editar

                            </a>



                            <!-- EXCLUIR -->

                            <a th:href="@{/categorias/excluir/{id}(id=${categoria.id})}"
                               class="product-action delete-action"
                               onclick="return confirm('Deseja realmente excluir esta categoria?')">


                                <svg xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M3 6h18"/>

                                    <path d="M8 6V4h8v2"/>

                                    <path d="M19 6l-1 14H6L5 6"/>

                                    <path d="M10 11v5"/>

                                    <path d="M14 11v5"/>

                                </svg>


                                Excluir

                            </a>


                        </div>

                    </td>


                </tr>



                <!-- =================================================
                     NENHUMA CATEGORIA
                ================================================== -->

                <tr th:if="${#lists.isEmpty(categorias)}">

                    <td colspan="3"
                        class="empty-table">

                        <div class="empty-products">

                            <div class="empty-products-icon">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M20 7h-9"/>

                                    <path d="M14 17H5"/>

                                    <path d="M18 12H6"/>

                                </svg>

                            </div>


                            <strong>
                                Nenhuma categoria cadastrada
                            </strong>


                            <span>
                                Cadastre uma categoria para começar.
                            </span>

                        </div>

                    </td>

                </tr>


                </tbody>

            </table>

        </div>


    </div>


</section>

</body>

</html>
