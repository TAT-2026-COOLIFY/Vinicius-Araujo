<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::section})}">

<head>

    <title>Produtos</title>

</head>


<body>

<section>


    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <div class="dashboard-header produtos-page-header">


        <div>

            <h1 class="dashboard-title">
                Produtos
            </h1>

            <p class="dashboard-subtitle">
                Gerencie os produtos cadastrados no estoque.
            </p>

        </div>


        <a th:href="@{/produtos/novo}"
           class="page-button">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round">

                <path d="M12 5v14"/>

                <path d="M5 12h14"/>

            </svg>

            <span>
                Novo Produto
            </span>

        </a>


    </div>



    <!-- =====================================================
         LISTA DE PRODUTOS
    ===================================================== -->

    <div class="dashboard-box products-list-box">


        <!-- =================================================
             CABEÇALHO DA TABELA
        ================================================== -->

        <div class="box-header products-box-header">


            <div class="products-heading">

                <h2>
                    Produtos cadastrados
                </h2>

                <span>
                    Lista de produtos disponíveis no sistema
                </span>

            </div>



            <!-- =============================================
                 BUSCA
            ============================================== -->

            <div class="produto-busca">


                <div class="search-wrapper">


                    <svg class="search-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <circle cx="11"
                                cy="11"
                                r="7"/>

                        <path d="m20 20-4-4"/>

                    </svg>


                    <input
                            type="text"
                            id="campoBusca"
                            class="search-input"
                            placeholder="Buscar produto..."
                            autocomplete="off">


                </div>



                <button
                        type="button"
                        id="botaoBuscar"
                        class="search-button">


                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <circle cx="11"
                                cy="11"
                                r="7"/>

                        <path d="m20 20-4-4"/>

                    </svg>


                    <span>
                        Buscar
                    </span>


                </button>


            </div>


        </div>



        <!-- =================================================
             TABELA
        ================================================== -->

        <div class="table-container">


            <table class="modern-table">


                <thead>

                <tr>

                    <th class="column-id">
                        ID
                    </th>

                    <th>
                        Produto
                    </th>

                    <th>
                        Categoria
                    </th>

                    <th>
                        Quantidade
                    </th>

                    <th class="column-actions">
                        Ações
                    </th>

                </tr>

                </thead>



                <tbody id="tabelaProdutos">


                <!-- =========================================
                     PRODUTOS
                ========================================== -->

                <tr th:each="produto : ${produtos}"
                    class="linha-produto">


                    <!-- ID -->

                    <td class="product-id"
                        th:text="${produto.id}">

                        1

                    </td>



                    <!-- PRODUTO -->

                    <td class="product-cell">

                        <div class="product-name"
                             th:text="${produto.nome}">

                            Produto

                        </div>

                    </td>



                    <!-- CATEGORIA -->

                    <td>

                        <span class="product-category"
                              th:text="${produto.categoria.nome}">

                            Categoria

                        </span>

                    </td>


                    <!-- QUANTIDADE -->

                    <td>

                        <span
                                class="stock-badge"
                                th:classappend="${produto.quantidadeAtual <= 5} ? ' stock-low' : ''"
                                th:text="${produto.quantidadeAtual}">

                            0

                        </span>

                    </td>



                    <!-- AÇÕES -->

                    <td>

                        <div class="product-actions">


                            <!-- EDITAR -->

                            <a
                                    th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                                    class="product-action edit-action">


                                <svg viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="1.8"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M12 20h9"/>

                                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>

                                </svg>


                                <span>
                                    Editar
                                </span>


                            </a>



                            <!-- EXCLUIR -->

                            <a
                                    th:href="@{/produtos/excluir/{id}(id=${produto.id})}"
                                    class="product-action delete-action"
                                    onclick="return confirm('Deseja excluir este produto?')">


                                <svg viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="1.8"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M4 7h16"/>

                                    <path d="M10 11v6"/>

                                    <path d="M14 11v6"/>

                                    <path d="M5 7l1 14h12l1-14"/>

                                    <path d="M9 7V4h6v3"/>

                                </svg>


                                <span>
                                    Excluir
                                </span>


                            </a>


                        </div>

                    </td>


                </tr>



                <!-- =========================================
                     NENHUM PRODUTO
                ========================================== -->

                <tr th:if="${#lists.isEmpty(produtos)}">


                    <td colspan="5"
                        class="empty-table">


                        <div class="empty-products">


                            <div class="empty-products-icon">

                                <svg viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="1.6"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>

                                    <path d="m3.3 7 8.7 5 8.7-5"/>

                                    <path d="M12 22V12"/>

                                </svg>

                            </div>


                            <strong>
                                Nenhum produto cadastrado
                            </strong>


                            <span>
                                Cadastre um produto para começar.
                            </span>


                        </div>


                    </td>


                </tr>


                </tbody>


            </table>


        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT - BUSCA
    ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const campoBusca =
                    document.getElementById("campoBusca");


                const botaoBuscar =
                    document.getElementById("botaoBuscar");


                if (!campoBusca || !botaoBuscar) {
                    return;
                }



                function filtrarProdutos() {


                    const texto =
                        campoBusca.value
                            .toLowerCase()
                            .trim();


                    const linhas =
                        document.querySelectorAll(
                            ".linha-produto"
                        );


                    linhas.forEach(
                        function (linha) {


                            const nomeProduto =
                                linha
                                    .querySelector(
                                        ".product-cell"
                                    )
                                    .textContent
                                    .toLowerCase()
                                    .trim();


                            if (
                                nomeProduto.includes(texto)
                            ) {

                                linha.style.display = "";

                            } else {

                                linha.style.display = "none";

                            }

                        }
                    );

                }



                /* =========================================
                   BUSCA ENQUANTO DIGITA
                ========================================== */

                campoBusca.addEventListener(
                    "input",
                    filtrarProdutos
                );



                /* =========================================
                   BOTÃO BUSCAR
                ========================================== */

                botaoBuscar.addEventListener(
                    "click",
                    function () {

                        filtrarProdutos();

                        campoBusca.focus();

                    }
                );



                /* =========================================
                   ENTER
                ========================================== */

                campoBusca.addEventListener(
                    "keydown",
                    function (event) {

                        if (event.key === "Enter") {

                            filtrarProdutos();

                        }

                    }
                );


            }
        );

    </script>


</section>

</body>

</html>
