<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login - Controle de Estoque</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

</head>


<body class="login-page">


<div class="login-container">


    <div class="login-card">


        <!-- TOPO -->

        <div class="login-top">

            <div class="login-code">

                FICHA Nº INV-2026-0847

            </div>

            <div class="login-restricted">

                ACESSO RESTRITO

            </div>

        </div>


        <!-- CÓDIGO DE BARRAS -->
        <div class="login-barcode"></div>



        <div class="login-divider"></div>



        <!-- MARCA -->

        <div class="login-brand">

            <div class="login-brand-title">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="m21 16-9 5-9-5V8l9-5 9 5Z"/>
                    <path d="m3.3 7.8 8.7 5 8.7-5"/>
                    <path d="M12 22V13"/>

                </svg>

                <strong>
                    CONTROLE DE ESTOQUE
                </strong>

            </div>


            <span>
                SISTEMA DE GESTÃO
            </span>

        </div>



        <!-- CABEÇALHO -->

        <div class="login-header">

            <h1>
                Bem-vindo de volta
            </h1>

            <p>
                Entre com suas credenciais para acessar o sistema.
            </p>

        </div>



        <!-- ERRO -->

        <div th:if="${param.error}"
             class="login-alert login-alert-error">

            Usuário ou senha inválidos.

        </div>



        <!-- LOGOUT -->

        <div th:if="${param.logout}"
             class="login-alert login-alert-success">

            Você saiu do sistema.

        </div>



        <!-- FORMULÁRIO -->

        <form th:action="@{/login}"
              method="post">


            <!-- USUÁRIO -->

            <div class="login-form-group">

                <label for="username">
                    Usuário
                </label>

                <div class="login-input-wrapper">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M20 21a8 8 0 0 0-16 0"/>
                        <circle cx="12"
                                cy="7"
                                r="4"/>

                    </svg>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Digite seu usuário"
                            required
                            autofocus>

                </div>

            </div>



            <!-- SENHA -->

            <div class="login-form-group">

                <label for="password">
                    Senha
                </label>

                <div class="login-input-wrapper">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <rect x="3"
                              y="11"
                              width="18"
                              height="10"
                              rx="2"/>

                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

                    </svg>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            required>

                </div>

            </div>



            <!-- BOTÃO -->

            <button
                    type="submit"
                    class="login-button">

    <span>
        Entrar
    </span>

                <svg class="login-arrow"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M5 12h14"/>
                    <path d="m13 6 6 6-6 6"/>

                </svg>

            </button>


        </form>

    </div>


</div>


</body>

</html>
