<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Controle de Estoque</title>


  <!-- =========================
       BOOTSTRAP
       ========================= -->

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f6fb;
      color: #172033;
      font-family:
              Inter,
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Roboto,
              Arial,
              sans-serif;
    }


    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
      position: fixed;

      top: 0;
      left: 0;
      bottom: 0;

      width: 250px;

      background: #202124;

      padding: 26px 16px;

      display: flex;
      flex-direction: column;

      z-index: 1000;

      box-shadow: 4px 0 18px rgba(0, 0, 0, 0.08);
    }


    .sidebar-brand {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 8px 10px 30px;

      color: white;

      text-decoration: none;
    }


    .sidebar-brand-icon {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border-radius: 11px;

      background: #4f46e5;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
    }


    .sidebar-brand-text {
      display: flex;
      flex-direction: column;

      line-height: 1.2;
    }


    .sidebar-brand-title {
      color: white;

      font-size: 15px;

      font-weight: 700;
    }


    .sidebar-brand-subtitle {
      margin-top: 4px;

      color: #9ca3af;

      font-size: 10px;

      letter-spacing: 0.6px;
    }


    /* MENU */

    .sidebar-menu {
      display: flex;
      flex-direction: column;

      gap: 6px;
    }


    .sidebar-link {
      display: flex;
      align-items: center;

      gap: 13px;

      width: 100%;

      padding: 12px 13px;

      border: 0;

      border-radius: 9px;

      background: transparent;

      color: #aeb4c0;

      text-decoration: none;

      font-size: 14px;

      font-weight: 500;

      cursor: pointer;

      transition:
              background 0.2s ease,
              color 0.2s ease;
    }


    .sidebar-link:hover {
      background: #2c2e33;

      color: white;
    }


    .sidebar-link i {
      width: 22px;

      flex-shrink: 0;

      font-style: normal;

      font-size: 17px;

      text-align: center;
    }


    .sidebar-divider {
      height: 1px;

      margin: 20px 10px;

      background: #34363b;
    }


    .sidebar-logout {
      margin-top: auto;
    }


    .sidebar-logout form {
      margin: 0;
    }


    .sidebar-logout button {
      text-align: left;
    }


    .sidebar-logout button:hover {
      background: #38272a;

      color: #ff8585;
    }


    /* =========================
       CONTEÚDO
       ========================= */

    .main-content {
      min-height: 100vh;

      margin-left: 250px;

      padding: 38px 40px;
    }


    /* =========================
       DASHBOARD
       ========================= */

    .dashboard-header {
      margin-bottom: 28px;
    }


    .dashboard-title {
      margin: 0;

      color: #172033;

      font-size: 32px;

      font-weight: 700;

      letter-spacing: -0.5px;
    }


    .dashboard-subtitle {
      margin: 7px 0 0;

      color: #7b879c;

      font-size: 14px;
    }


    /* CARDS */

    .dashboard-stats {
      display: grid;

      grid-template-columns:
                repeat(4, minmax(0, 1fr));

      gap: 18px;

      margin-bottom: 24px;
    }


    .stat-card {
      min-height: 165px;

      padding: 24px;

      background: white;

      border: 1px solid #e4e8ef;

      border-radius: 14px;

      box-shadow:
              0 4px 14px rgba(31, 41, 55, 0.04);

      transition:
              transform 0.2s ease,
              box-shadow 0.2s ease;
    }


    .stat-card:hover {
      transform: translateY(-2px);

      box-shadow:
              0 8px 22px rgba(31, 41, 55, 0.08);
    }


    .stat-top {
      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .stat-title {
      color: #60708a;

      font-size: 14px;

      font-weight: 600;
    }


    .stat-icon {
      width: 44px;
      height: 44px;

      border-radius: 11px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
    }


    .stat-blue {
      background: #edf4ff;
    }


    .stat-green {
      background: #ebfaf3;
    }


    .stat-purple {
      background: #f2edff;
    }


    .stat-red {
      background: #fff0f0;
    }


    .stat-value {
      margin-top: 18px;

      color: #111827;

      font-size: 30px;

      font-weight: 700;
    }


    .stat-description {
      margin-top: 4px;

      color: #94a3b8;

      font-size: 12px;
    }


    /* SEGUNDA LINHA */

    .dashboard-grid {
      display: grid;

      grid-template-columns:
                minmax(0, 2fr)
                minmax(320px, 1fr);

      gap: 18px;

      margin-bottom: 24px;
    }


    .dashboard-box {
      background: white;

      border: 1px solid #e4e8ef;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
              0 4px 14px rgba(31, 41, 55, 0.04);
    }


    .box-header {
      min-height: 78px;

      padding: 20px 24px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom: 1px solid #edf0f4;
    }


    .box-header h2 {
      margin: 0;

      color: #172033;

      font-size: 16px;

      font-weight: 700;
    }


    .box-header span {
      display: block;

      margin-top: 5px;

      color: #94a3b8;

      font-size: 12px;
    }


    .box-content {
      padding: 24px;
    }


    .box-content h3 {
      margin: 0 0 8px;

      color: #172033;

      font-size: 16px;

      font-weight: 600;
    }


    .box-content p {
      margin: 0;

      color: #718096;

      font-size: 13px;

      line-height: 1.7;
    }


    /* ALERTA */

    .stock-warning {
      display: flex;

      align-items: center;

      gap: 15px;

      padding: 18px;

      background: #fff9ed;

      border: 1px solid #f8dfae;

      border-radius: 11px;
    }


    .warning-icon {
      width: 44px;
      height: 44px;

      flex-shrink: 0;

      border-radius: 10px;

      background: #fff0cf;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
    }


    .stock-warning strong {
      color: #6b4b16;

      font-size: 14px;
    }


    .stock-warning p {
      margin-top: 5px;

      color: #8a6a35;

      font-size: 12px;
    }


    /* MOVIMENTAÇÕES */

    .movements-box {
      margin-bottom: 24px;
    }


    .view-all {
      color: #4f46e5;

      font-size: 12px;

      font-weight: 600;

      text-decoration: none;
    }


    .view-all:hover {
      color: #3730a3;
    }


    .table-container {
      width: 100%;

      overflow-x: auto;
    }


    .modern-table {
      width: 100%;

      border-collapse: collapse;
    }


    .modern-table th {
      padding: 14px 20px;

      background: #fafbfc;

      border-bottom: 1px solid #e8ecf1;

      color: #7b879c;

      font-size: 11px;

      font-weight: 600;

      text-align: left;

      text-transform: uppercase;
    }


    .modern-table td {
      padding: 16px 20px;

      border-bottom: 1px solid #edf0f4;

      color: #66758a;

      font-size: 13px;
    }


    .modern-table tbody tr:last-child td {
      border-bottom: 0;
    }


    .modern-table tbody tr:hover {
      background: #fafbff;
    }


    .product-cell {
      color: #172033 !important;

      font-weight: 600;
    }


    .movement-badge {
      display: inline-flex;

      align-items: center;

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 11px;

      font-weight: 600;
    }


    .movement-entry {
      background: #eaf8f0;

      color: #16834d;
    }


    .movement-exit {
      background: #fff0f1;

      color: #d83a4a;
    }


    .empty-table {
      padding: 30px !important;

      color: #94a3b8 !important;

      text-align: center;
    }


    /* =========================
       RESPONSIVO
       ========================= */

    @media (max-width: 1100px) {

      .dashboard-stats {
        grid-template-columns:
                    repeat(2, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 768px) {

      .sidebar {
        width: 72px;

        padding: 20px 10px;
      }


      .sidebar-brand {
        justify-content: center;

        padding-left: 0;
        padding-right: 0;
      }


      .sidebar-brand-text {
        display: none;
      }


      .sidebar-link {
        justify-content: center;

        padding: 12px;
      }


      .sidebar-link span {
        display: none;
      }


      .main-content {
        margin-left: 72px;

        padding: 24px 18px;
      }


      .dashboard-stats {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>
